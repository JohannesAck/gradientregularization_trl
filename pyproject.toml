[project]
name = "trl-gradreg"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "accelerate>=1.12.0",
  "datasets>=4.5.0",
  "deepspeed>=0.18.5",
  "math-verify>=0.9.0",
  "num2words==0.5.14",
  "numpy>=2",
  "peft>=0.18.1",
  "torch>=2.9",
  "torchvision>=0.20",
  "trackio>=0.15.0",
  "trl[vllm]>=0.27.2",
  "wandb>=0.24.2",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
